<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parking Slots | Sreelekha Parking System</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app-nav"></div>

  <main class="container">
    <div class="page-head">
      <div>
        <p class="eyebrow">FACILITY INVENTORY</p>
        <h1>Parking Bays & Slots</h1>
        <p class="muted">Live map of parking slots across Ground Floor, Basement, and Upper Levels.</p>
      </div>
      <div style="display:flex; gap:10px;">
        <button class="btn primary" onclick="openAddSlotModal()">+ Add New Slot</button>
        <button class="btn outline" onclick="loadSlots()">↻ Refresh</button>
      </div>
    </div>

    <!-- Filters & Legend -->
    <div class="panel" style="padding:16px 24px;">
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:16px;">
        <div class="filter-pills" id="slotFilters">
          <button class="pill-btn active" onclick="filterSlotStatus('All', this)">All Slots</button>
          <button class="pill-btn" onclick="filterSlotStatus('Available', this)">🟢 Available</button>
          <button class="pill-btn" onclick="filterSlotStatus('Occupied', this)">🟠 Occupied</button>
          <button class="pill-btn" onclick="filterSlotStatus('Maintenance', this)">⚪ Maintenance</button>
        </div>

        <div style="display:flex; gap:10px; align-items:center;">
          <label style="font-size:12px; font-weight:600; color:#64748b;">Vehicle Type:</label>
          <select id="slotTypeFilter" onchange="filterSlotType(this.value)" style="padding:6px 12px; border:1px solid #cbd5e1; border-radius:6px; font-size:12px;">
            <option value="All">All Types</option>
            <option value="Car">Cars Only</option>
            <option value="Bike">Bikes Only</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Slots Grid -->
    <div id="slotGrid" class="grid three" style="margin-top:20px;">
      <p class="muted">Loading slots...</p>
    </div>
  </main>

  <!-- Add Slot Modal -->
  <div id="addSlotModal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-head">
        <h3 style="font-size:17px; font-weight:700;">Add New Parking Slot</h3>
        <button class="modal-close" onclick="closeAddSlotModal()">&times;</button>
      </div>

      <form id="addSlotForm" onsubmit="submitAddSlot(event)">
        <div class="form-group" style="margin-bottom:14px;">
          <label>Slot Number *</label>
          <input name="slot_number" required placeholder="e.g. D-01, A-05">
        </div>

        <div class="form-group" style="margin-bottom:14px;">
          <label>Floor / Location *</label>
          <input name="location" required placeholder="e.g. Ground Floor - Zone D">
        </div>

        <div class="form-group" style="margin-bottom:18px;">
          <label>Allowed Vehicle Type *</label>
          <select name="vehicle_type">
            <option value="Car">Car</option>
            <option value="Bike">Bike</option>
            <option value="Any">Any Vehicle</option>
          </select>
        </div>

        <div class="modal-actions" style="display:flex; justify-content:flex-end; gap:10px;">
          <button type="button" class="btn outline" onclick="closeAddSlotModal()">Cancel</button>
          <button type="submit" class="btn primary">Save Slot</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal for Receipt Ticket -->
  <div id="receiptModal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-head">
        <h3 style="font-size:17px; font-weight:700;">Parking Bill & Receipt</h3>
        <button class="modal-close" onclick="closeReceiptModal()">&times;</button>
      </div>
      <div id="receiptBody"></div>
      <div class="modal-actions" style="display:flex; justify-content:flex-end; gap:10px; margin-top:16px;">
        <button class="btn outline" onclick="closeReceiptModal()">Close</button>
        <button class="btn primary" onclick="window.print()">🖨️ Print Receipt</button>
      </div>
    </div>
  </div>

  <div id="app-footer"></div>

  <script src="js/main.js"></script>
  <script src="js/parking.js"></script>
</body>
</html>
